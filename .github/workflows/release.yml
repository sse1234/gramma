name: Release

# Desktop builds for a version tag (v1.0.1), attached to a GitHub
# release whose body is that version's CHANGELOG section. A manual run
# builds the same artifacts without publishing (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' app/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Flutter (x64, SDK archive)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter (arm64, from git — no arm64 SDK archive)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev file
      - run: flutter build linux --release
        working-directory: app
      - run: tool/package-linux.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Flutter (x64, SDK archive)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter (arm64, from git)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $env:USERPROFILE\flutter
          "$env:USERPROFILE\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\flutter\bin\flutter" --version
      - run: flutter build windows --release
        working-directory: app
      - shell: pwsh
        run: tool/package-windows.ps1 -Version "${{ needs.version.outputs.version }}" -Arch "${{ matrix.arch }}" -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: tool/changelog-section.sh "${{ needs.version.outputs.version }}" > body.md
      - run: ls -l dist && cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: gramma ${{ needs.version.outputs.version }}
          body_path: body.md
          files: dist/*
