name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned to the version the releases are built with (release.yml,
      # FLUTTER_VERSION): CI tests what ships. "stable" moved to 3.50,
      # whose analyzer flags every material.dart import as deprecated;
      # that migration is a change of its own, not a CI surprise.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true
      - name: Build bridge library for host tests
        run: cargo build -p rust_lib_gramma
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
